<!doctype html>
<html>
  <head>
    <title>Website Ucapan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="judul">Website Ucapan Spesial 💖</h1>
    <p id="info">Klik tombol 5 kali untuk membuka ucapan</p>

    <button id="btnMulai">Klik Aku</button>

    <p id="counter">Klik: 0</p>

    <p id="ucapan" style="display: none">
      🎉 Terima kasih <span id="namaPengirim"></span> 💖
    </p>

    <button id="btnWa" style="display: none">Balas ke WhatsApp 💬</button>

    <button id="btnKamera" style="display: none">📸 Ambil Foto</button>

    <div id="kameraBox" style="display: none">
      <video id="video" autoplay></video>
      <br />
      <button id="btnFoto">📷 Jepret</button>
    </div>

    <canvas id="canvas" style="display: none"></canvas>

    <img id="hasilFoto" style="display: none; width: 80%; margin-top: 20px" />

    <button id="btnShare" style="display: none">📤 Bagikan Foto</button>

    <audio id="bgm" loop>
      <source src="audio.mp3" type="audio/mpeg" />
    </audio>

    <script src="script.js"></script>
  </body>
</html>
